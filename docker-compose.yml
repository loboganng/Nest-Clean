services:
  postgres:
    container_name: nest-clean-pg
    image: postgres:17-alpine
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nest-clean
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the API in a container too: `docker compose --profile app up -d --build`
  api:
    profiles: [app]
    build: .
    ports:
      - 3333:3333
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:docker@postgres:5432/nest-clean?schema=public
    depends_on:
      postgres:
        condition: service_healthy
